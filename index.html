    <style>
        /* CSS Variables for Theme System */
        :root {
            --bg-primary: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            --bg-secondary: rgba(30, 30, 60, 0.8);
            --bg-tertiary: rgba(15, 15, 35, 0.9);
            --bg-card: rgba(30, 30, 60, 0.6);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --accent-error: #ef4444;
            --border-color: rgba(99, 102, 241, 0.3);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --modal-bg: rgba(0, 0, 0, 0.8);
            --modal-content: rgba(30, 30, 60, 0.95);
        }

        [data-theme="light"] {
            --bg-primary: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #cbd5e1 100%);
            --bg-secondary: rgba(255, 255, 255, 0.9);
            --bg-tertiary: rgba(248, 250, 252, 0.95);
            --bg-card: rgba(255, 255, 255, 0.8);
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-success: #059669;
            --accent-warning: #d97706;
            --accent-error: #dc2626;
            --border-color: rgba(99, 102, 241, 0.2);
            --shadow-color: rgba(0, 0, 0, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.1);
            --modal-bg: rgba(0, 0, 0, 0.5);
            --modal-content: rgba(255, 255, 255, 0.98);
        }

        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .loading-app {
            cursor: wait;
        }

        .loading-app::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.9;
        }

        .loading-app::after {
            content: 'Loading Interstellar Lite Pro...';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 500;
        }

        /* Header Styles */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--bg-secondary);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            position: relative;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 18px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .version-badge {
            background: var(--accent-success);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Button Styles */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--glass-bg);
            transform: translateY(-1px);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--accent-success), #059669);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            padding: 0;
            justify-content: center;
            border-radius: 8px;
        }

        /* Icon Styles */
        .icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .btn-icon .icon {
            width: 16px;
            height: 16px;
        }

        /* Main Layout */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .sidebar .btn {
            justify-content: flex-start;
            width: 100%;
            padding: 12px 16px;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Editor Container */
        .editor-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .editor-panel, .preview-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin: 10px;
            overflow: hidden;
            backdrop-filter: blur(20px);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
        }

        .panel-title {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .panel-controls {
            display: flex;
            gap: 8px;
        }

        #editor {
            flex: 1;
            background: var(--bg-tertiary);
        }

        #preview {
            flex: 1;
            border: none;
            background: white;
        }

        /* Prompt Area */
        .prompt-area {
            padding: 20px;
            background: var(--bg-secondary);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
        }

        .prompt-enhancement-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .prompt-enhancement-bar .btn {
            font-size: 12px;
            padding: 6px 12px;
            height: auto;
        }

        .prompt-container {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            max-width: 1200px;
            margin: 0 auto;
        }

        .prompt-input {
            flex: 1;
            min-height: 44px;
            max-height: 120px;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            resize: none;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .prompt-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .prompt-input::placeholder {
            color: var(--text-muted);
        }

        .prompt-submit {
            width: 44px;
            height: 44px;
            padding: 0;
            justify-content: center;
            border-radius: 12px;
        }

        .prompt-status {
            text-align: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--text-secondary);
            min-height: 20px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .prompt-status.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-error);
            border-left: 3px solid var(--accent-error);
        }

        .prompt-status.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-success);
            border-left: 3px solid var(--accent-success);
        }

        .prompt-status.warning {
            background: rgba(245, 158, 11, 0.1);
            color: var(--accent-warning);
            border-left: 3px solid var(--accent-warning);
        }

        /* Notification System */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            max-width: 400px;
            background: var(--modal-content);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 20px var(--shadow-color);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .notification-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
        }

        .notification-message {
            flex: 1;
            font-size: 14px;
            color: var(--text-primary);
        }

        .notification-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 18px;
            margin-left: 12px;
            padding: 0;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .notification-close:hover {
            background: var(--glass-bg);
            color: var(--text-primary);
        }

        .notification-error {
            border-left: 4px solid var(--accent-error);
        }

        .notification-success {
            border-left: 4px solid var(--accent-success);
        }

        .notification-warning {
            border-left: 4px solid var(--accent-warning);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--modal-bg);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--modal-content);
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            transform: scale(0.9) translateY(20px);
            transition: all 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: var(--glass-bg);
            color: var(--text-primary);
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body {
                font-size: 14px;
            }
            
            .header {
                padding: 8px 16px;
                flex-wrap: wrap;
                gap: 8px;
            }
            
            .logo {
                font-size: 16px;
                flex: 1;
            }
            
            .logo-icon {
                width: 28px;
                height: 28px;
            }
            
            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                height: 100vh;
                z-index: 200;
                transition: left 0.3s ease;
                box-shadow: 2px 0 10px rgba(0, 0, 0, 0.3);
            }
            
            .sidebar.open {
                left: 0;
            }
            
            .main-container {
                flex-direction: column;
                height: calc(100vh - 60px);
            }
            
            .content-area {
                height: 100%;
                display: flex;
                flex-direction: column;
            }
            
            .editor-container {
                flex-direction: column;
                flex: 1;
                min-height: 0;
            }
            
            .editor-panel, .preview-panel {
                margin: 5px;
                min-height: 200px;
                flex: 1;
            }
            
            .panel-header {
                padding: 8px 12px;
                font-size: 14px;
            }
            
            .prompt-area {
                padding: 12px 16px;
                flex-shrink: 0;
            }
            
            .prompt-enhancement-bar {
                margin-bottom: 8px;
                justify-content: center;
            }
            
            .prompt-enhancement-bar .btn {
                font-size: 11px;
                padding: 4px 8px;
            }
            
            .prompt-container {
                flex-direction: column;
                gap: 8px;
            }
            
            .prompt-input {
                min-height: 80px;
                font-size: 16px; /* Prevents zoom on iOS */
            }
            
            .prompt-submit {
                width: 100%;
                height: 44px;
                font-size: 16px;
            }
            
            .modal-content {
                margin: 20px;
                width: calc(100% - 40px);
                max-height: calc(100vh - 80px);
                overflow-y: auto;
            }
            
            .btn {
                min-height: 44px; /* Better touch targets */
                font-size: 14px;
            }
            
            .btn-icon {
                width: 44px;
                height: 44px;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 6px 12px;
            }
            
            .header-actions {
                gap: 6px;
            }
            
            .logo {
                font-size: 14px;
            }
            
            .sidebar {
                width: 260px;
                left: -260px;
            }
            
            .sidebar-section h3 {
                font-size: 14px;
            }
            
            .btn {
                padding: 8px 12px;
                font-size: 13px;
                min-height: 40px;
            }
            
            .btn-icon {
                width: 40px;
                height: 40px;
            }
            
            .prompt-enhancement-bar .btn {
                font-size: 10px;
                padding: 3px 6px;
                min-height: 32px;
            }
            
            .modal-content {
                margin: 10px;
                width: calc(100% - 20px);
                max-height: calc(100vh - 40px);
            }
            
            .form-input {
                font-size: 16px; /* Prevents zoom on iOS */
                padding: 10px 12px;
            }
        }

        /* Touch-friendly improvements */
        @media (hover: none) and (pointer: coarse) {
            .btn:hover {
                transform: none;
                box-shadow: 0 2px 8px var(--shadow-color);
            }
            
            .btn:active {
                transform: scale(0.98);
                transition: transform 0.1s ease;
            }
            
            .template-item:hover,
            .history-item:hover {
                background: var(--glass-bg);
            }
            
            .template-item:active,
            .history-item:active {
                transform: scale(0.98);
                transition: transform 0.1s ease;
            }
        }

        /* Loading and Animation States */
        .loading {
            position: relative;
            pointer-events: none;
        }

        .loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid transparent;
            border-top: 2px solid var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 10;
        }

        .loading .icon {
            opacity: 0.3;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-in {
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .bounce {
            animation: bounce 0.6s ease;
        }

        @keyframes bounce {
            0%, 20%, 53%, 80%, 100% { transform: translate3d(0, 0, 0); }
            40%, 43% { transform: translate3d(0, -8px, 0); }
            70% { transform: translate3d(0, -4px, 0); }
            90% { transform: translate3d(0, -2px, 0); }
        }

        /* Smooth transitions */
        * {
            transition: color 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
        }

        .btn, .form-input, .modal-content, .sidebar {
            transition: all 0.2s ease;
        }

        /* Theme Toggle */
        .theme-toggle {
            position: relative;
            width: 50px;
            height: 24px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-toggle::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            background: var(--accent-primary);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

    <script>

        // Global variables

        let promptTemplates = [

        let currentProject = {
            name: 'My App',

<html lang="en">
<head>

<body>

</body>
</html>`,
            isInitialGeneration: true,

        let isProcessing = false;

        // Initialize application
        document.addEventListener('DOMContentLoaded', initializeApp);

        function initializeApp() {
            // Show loading state
            document.body.classList.add('loading-app');
            
            // Initialize core features
            setupMonacoEditor();
            setupEventListeners();
            setupMobileResponsive();
            loadSavedTheme();
            loadSavedProject();
            
            // Defer non-critical features
            requestAnimationFrame(() => {
                updatePreview();
                initializePerformanceOptimizations();
                document.body.classList.remove('loading-app');
            });
        }

        function initializePerformanceOptimizations() {
            // Lazy load images
            const images = document.querySelectorAll('img[data-src]');
            if ('IntersectionObserver' in window) {
                const imageObserver = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const img = entry.target;
                            img.src = img.dataset.src;
                            img.removeAttribute('data-src');
                            observer.unobserve(img);
                        }
                    });
                });
                images.forEach(img => imageObserver.observe(img));
            }

            // Preload critical resources
            preloadCriticalResources();
            
            // Setup service worker for caching
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').catch(console.warn);
            }
        }

        function preloadCriticalResources() {
            // Preload Monaco Editor resources
            const link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = 'https://unpkg.com/monaco-editor@0.44.0/min/vs/editor/editor.main.js';
            document.head.appendChild(link);
        }

        // Monaco Editor Setup
        function setupMonacoEditor() {
            require.config({ paths: { vs: 'https://unpkg.com/monaco-editor@0.44.0/min/vs' } });
            require(['vs/editor/editor.main'], function () {
                editor = monaco.editor.create(document.getElementById('editor'), {
                    value: currentProject.code,
                    language: 'html',
                    theme: document.body.dataset.theme === 'dark' ? 'vs-dark' : 'vs',
                    automaticLayout: true,
                    fontSize: window.innerWidth < 768 ? 12 : 14,
                    lineNumbers: 'on',
                    minimap: { enabled: window.innerWidth > 768 },
                    scrollBeyondLastLine: false,
                    wordWrap: 'on',
                    tabSize: 2,
                    insertSpaces: true,
                    formatOnPaste: true,
                    formatOnType: true,
                    suggestOnTriggerCharacters: true,
                    acceptSuggestionOnEnter: 'on',
                    tabCompletion: 'on',
                    parameterHints: { enabled: true },
                    quickSuggestions: {
                        other: true,
                        comments: false,
                        strings: true
                    },
                    hover: { enabled: true },
                    contextmenu: true,
                    mouseWheelZoom: true,
                    multiCursorModifier: 'ctrlCmd',
                    bracketMatching: 'always',
                    renderWhitespace: 'selection',
                    folding: true,
                    colorDecorators: true,
                    links: true,
                    find: {
                        seedSearchStringFromSelection: 'always',
                        autoFindInSelection: 'never'
                    }
                });

                // Auto-save functionality
                let saveTimeout;
                editor.onDidChangeModelContent(() => {
                    clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(() => {
                        currentProject.code = editor.getValue();
                        autoSaveProject();
                        updatePreview();
                    }, 2000);
                });
            });
        }

        // Event Listeners
        function setupEventListeners() {
            // Theme toggle
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);

            // Main actions
            document.getElementById('newProjectBtn').addEventListener('click', newProject);
            document.getElementById('loadBtn').addEventListener('click', loadProject);
            document.getElementById('importBtn').addEventListener('click', () => showModal('import'));
            document.getElementById('cloneBtn').addEventListener('click', () => showModal('clone'));
            document.getElementById('publishBtn').addEventListener('click', () => showModal('publish'));
            document.getElementById('saveBtn').addEventListener('click', saveProject);
            document.getElementById('settingsBtn').addEventListener('click', () => showModal('settings'));

            // Editor controls
            document.getElementById('formatBtn').addEventListener('click', formatCode);
            document.getElementById('refreshBtn').addEventListener('click', updatePreview);
            document.getElementById('newTabBtn').addEventListener('click', openInNewTab);
            document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);

            // Prompt submission
            document.getElementById('submitBtn').addEventListener('click', submitPrompt);
            document.getElementById('promptInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    submitPrompt();
                }
            });

            // Prompt enhancement features
            document.getElementById('templatesBtn').addEventListener('click', showTemplatesModal);
            document.getElementById('historyBtn').addEventListener('click', showHistoryModal);
            document.getElementById('enhanceBtn').addEventListener('click', enhancePrompt);

            // Auto-resize textarea
            const promptInput = document.getElementById('promptInput');
            promptInput.addEventListener('input', () => {
                promptInput.style.height = 'auto';
                promptInput.style.height = Math.min(promptInput.scrollHeight, 120) + 'px';
            });

            // Mobile menu toggle
            document.getElementById('menuToggle').addEventListener('click', toggleMobileMenu);

            // Keyboard shortcuts
            document.addEventListener('keydown', handleKeyboardShortcuts);
        }

        // Mobile Responsive Setup
        function setupMobileResponsive() {
            const mediaQuery = window.matchMedia('(max-width: 768px)');

            function handleMobileChange(e) {
                const menuToggle = document.getElementById('menuToggle');
                if (e.matches) {
                    menuToggle.style.display = 'flex';
                } else {
                    menuToggle.style.display = 'none';
                    document.getElementById('sidebar').classList.remove('open');
                }
            }

            mediaQuery.addListener(handleMobileChange);
            handleMobileChange(mediaQuery);
        }

        // Theme Management
        function toggleTheme() {
            const currentTheme = document.body.dataset.theme;
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            document.body.dataset.theme = newTheme;
            localStorage.setItem('theme', newTheme);

            // Update Monaco editor theme
            if (editor) {
                monaco.editor.setTheme(newTheme === 'dark' ? 'vs-dark' : 'vs');
            }

            // Update theme toggle icon
            const themeIcon = document.querySelector('#themeToggle .icon');
            if (newTheme === 'dark') {
                themeIcon.innerHTML = \`<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>\`;
            } else {
                themeIcon.innerHTML = \`<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>\`;
            }
        }

        // Load saved theme
        function loadSavedTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.body.dataset.theme = savedTheme;
            if (savedTheme === 'light') {
                const themeIcon = document.querySelector('#themeToggle .icon');
                themeIcon.innerHTML = \`<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>\`;
            }
        }

        // Mobile Menu Toggle
        function toggleMobileMenu() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // Keyboard Shortcuts
        function handleKeyboardShortcuts(e) {
            // Ctrl/Cmd + S: Save project
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveProject();
            }

            // Ctrl/Cmd + Enter: Submit prompt
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                submitPrompt();
            }

            // Ctrl/Cmd + N: New project
            if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                e.preventDefault();
                newProject();
            }

            // F11: Toggle fullscreen
            if (e.key === 'F11') {
                e.preventDefault();
                toggleFullscreen();
            }

            // Escape: Close modals
            if (e.key === 'Escape') {
                closeModal();
            }
        }

        // Modal System
        function createModal(id, title, content, actions = []) {
            const existingModal = document.getElementById(id);
            if (existingModal) {
                existingModal.remove();
            }

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.id = id;
            modal.innerHTML = \`
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 class="modal-title">\${title}</h3>
                        <button class="modal-close" onclick="closeModal('\${id}')">
                            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="modal-body">
                        \${content}
                    </div>
                    <div class="modal-actions">
                        \${actions.map(action => \`<button class="btn \${action.class}" onclick="\${action.onclick}">\${action.text}</button>\`).join('')}
                    </div>
                </div>
            \`;

            document.body.appendChild(modal);

            // Show modal with animation
            setTimeout(() => modal.classList.add('active'), 10);

            // Close on overlay click
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal(id);
                }
            });

            return modal;
        }

        function showModal(type) {
            switch (type) {
                case 'settings':
                    showSettingsModal();
                    break;
                case 'import':
                    showImportModal();
                    break;
                case 'clone':
                    showCloneModal();
                    break;
                case 'publish':
                    showPublishModal();
                    break;
            }
        }

        function closeModal(id) {
            const modal = id ? document.getElementById(id) : document.querySelector('.modal-overlay.active');
            if (modal) {
                modal.classList.remove('active');
                setTimeout(() => modal.remove(), 300);
            }
        }

            if (isProcessing) return;

        async function generateWithAI(prompt) {
            const systemPrompt = `You are an expert web developer. Create a complete, modern, responsive HTML page based on the user's request. 

Requirements:
- Include all HTML, CSS, and JavaScript in a single file
- Use modern CSS with flexbox/grid for layouts
- Make it fully responsive for mobile and desktop
- Include proper meta tags and semantic HTML
- Use contemporary design principles
- Add interactive elements where appropriate
- Ensure accessibility standards
- Use CSS variables for theming

Return only the complete HTML code, no explanations or markdown.`;

            try {
                const response = await fetch(CONFIG.API_ENDPOINTS.OPENROUTER, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${CONFIG.OPENROUTER_API_KEY}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.origin,
                        'X-Title': 'Interstellar Lite Pro'
                    },
                    body: JSON.stringify({
                        model: CONFIG.MODELS.DEFAULT,
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.7,
                        max_tokens: 4000
                    })
                });

                if (!response.ok) {
                    throw new Error(`API request failed: ${response.status}`);
                }

                const data = await response.json();
                return data.choices[0]?.message?.content || null;
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

            const words = prompt.split(' ').slice(0, 3);
            return words.map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ') || 'Generated Website';
        }

        async function executeImport() {
            const repoUrl = document.getElementById('importRepoUrl')?.value?.trim();
            if (!repoUrl) {
                updatePromptStatus('Please enter a repository URL');
                setTimeout(() => updatePromptStatus(''), 3000);
                return;
            }

            if (!CONFIG.GITHUB_TOKEN) {
                updatePromptStatus('Please configure GitHub token in Settings');
                setTimeout(() => updatePromptStatus(''), 3000);
                return;
            }

            try {
                updatePromptStatus('Importing from GitHub...');
                
                // Extract owner and repo from URL
                const match = repoUrl.match(/github\.com\/([^\/]+)\/([^\/]+)/);
                if (!match) {
                    throw new Error('Invalid GitHub URL format');
                }
                
                const [, owner, repo] = match;
                const cleanRepo = repo.replace(/\.git$/, '');
                
                // Fetch repository contents
                const response = await fetch(`https://api.github.com/repos/${owner}/${cleanRepo}/contents`, {
                    headers: {
                        'Authorization': `token ${CONFIG.GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch repository');
                }

                const contents = await response.json();
                const indexFile = contents.find(file => 
                    file.name === 'index.html' || 
                    file.name === 'index.htm' ||
                    file.name.endsWith('.html')
                );

                if (!indexFile) {
                    throw new Error('No HTML file found in repository');
                }

                // Fetch the HTML file content
                const fileResponse = await fetch(indexFile.download_url);
                const htmlContent = await fileResponse.text();

                // Update project
                currentProject.code = htmlContent;
                currentProject.name = `${owner}/${cleanRepo}`;
                
                if (editor) {
                    editor.setValue(htmlContent);
                }
                
                updatePreview();
                autoSaveProject();
                
                updatePromptStatus('Project imported successfully!');
                closeModal('importModal');
                
            } catch (error) {
                console.error('Import error:', error);
                updatePromptStatus(`Import failed: ${error.message}`);
            }
            
            setTimeout(() => updatePromptStatus(''), 5000);
        }

                closeModal('cloneModal');
                
            } catch (error) {
                console.error('Clone error:', error);
                updatePromptStatus('Clone failed: Invalid URL');
            }
            
            setTimeout(() => updatePromptStatus(''), 5000);
        }

        async function executePublish() {
            const repoName = document.getElementById('publishRepoName')?.value?.trim();
            if (!repoName) {
                updatePromptStatus('Please enter a repository name');
                setTimeout(() => updatePromptStatus(''), 3000);
                return;
            }

            if (!CONFIG.GITHUB_TOKEN) {
                updatePromptStatus('Please configure GitHub token in Settings');
                setTimeout(() => updatePromptStatus(''), 3000);
                return;
            }

            try {
                updatePromptStatus('Publishing to GitHub...');
                
                // Get current code
                const code = editor ? editor.getValue() : currentProject.code;
                
                // Create repository
                const createRepoResponse = await fetch('https://api.github.com/user/repos', {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${CONFIG.GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: repoName,
                        description: `Website created with Interstellar Lite Pro`,
                        public: true,
                        auto_init: false
                    })
                });

                if (!createRepoResponse.ok && createRepoResponse.status !== 422) {
                    throw new Error('Failed to create repository');
                }

                const repoData = await createRepoResponse.json();
                const fullName = repoData.full_name || `username/${repoName}`; // Fallback

                // Upload index.html
                const uploadResponse = await fetch(`https://api.github.com/repos/${fullName}/contents/index.html`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${CONFIG.GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Initial commit: Add index.html',
                        content: btoa(unescape(encodeURIComponent(code))), // Base64 encode
                        branch: 'main'
                    })
                });

                if (!uploadResponse.ok) {
                    throw new Error('Failed to upload file');
                }

                // Enable GitHub Pages
                const pagesResponse = await fetch(`https://api.github.com/repos/${fullName}/pages`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${CONFIG.GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.pages-v1+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        source: {
                            branch: 'main',
                            path: '/'
                        }
                    })
                });

                // Pages might already be enabled, so don't fail on 409
                const pagesUrl = `https://${fullName.split('/')[0]}.github.io/${repoName}`;
                
                updatePromptStatus(`Published successfully! Site will be available at: ${pagesUrl}`);
                closeModal('publishModal');
                
            } catch (error) {
                console.error('Publish error:', error);
                updatePromptStatus(`Publish failed: ${error.message}`);
            }
            
            setTimeout(() => updatePromptStatus(''), 10000);
        }
    </script>
</body>
