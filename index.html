<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interstellar Lite</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Heroicons for professional icons -->
    <script src="https://unpkg.com/heroicons@2.0.18/24/outline/index.js" type="module"></script>

    <!-- Monaco Editor -->
    <script src="https://unpkg.com/monaco-editor@0.44.0/min/vs/loader.js"></script>
    
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header Styles */
        .header {
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 20px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-icon {
            font-size: 28px;
            filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.5));
        }

        .version-badge {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.3);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Enhanced Button Styles */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            background: rgba(30, 30, 60, 0.8);
            color: #e2e8f0;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-color: transparent;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #5855eb, #7c3aed);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.5);
        }

        .btn-accent {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-accent:hover {
            background: linear-gradient(135deg, #047857, #059669);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.5);
        }

        /* Icon Styles */
        .icon {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .btn-icon svg {
            width: 16px;
            height: 16px;
        }

        .btn-secondary {
            background: rgba(30, 30, 60, 0.6);
            border-color: rgba(99, 102, 241, 0.2);
        }

        .btn-accent {
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            border-color: transparent;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .btn-accent:hover {
            background: linear-gradient(135deg, #7c3aed, #9333ea);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.5);
        }

        .btn-ghost {
            background: transparent;
            border-color: transparent;
            color: #94a3b8;
        }

        .btn-ghost:hover {
            background: rgba(99, 102, 241, 0.1);
            color: #e2e8f0;
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 10px;
            background: rgba(30, 30, 60, 0.8);
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .btn-icon:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
        }

        /* Main Content Layout */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Enhanced Sidebar */
        .sidebar {
            width: 280px;
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(99, 102, 241, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-shrink: 0;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.3);
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Enhanced Editor Container */
        .editor-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            background: rgba(15, 15, 35, 0.5);
        }

        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(15, 15, 35, 0.95);
            border-right: 1px solid rgba(99, 102, 241, 0.2);
        }

        .preview-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(15, 15, 35, 0.95);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(30, 30, 60, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
            height: 60px;
            flex-shrink: 0;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .panel-controls {
            display: flex;
            gap: 10px;
        }

        /* Monaco Editor */
        .monaco-editor {
            flex: 1;
            overflow: hidden;
            border-radius: 0 0 12px 12px;
        }

        /* Preview Iframe */
        .preview-iframe {
            flex: 1;
            border: none;
            background: #ffffff;
            border-radius: 0 0 12px 0;
        }

        /* Enhanced Resize Handle */
        .resize-handle {
            width: 6px;
            background: linear-gradient(180deg, rgba(99, 102, 241, 0.3), rgba(139, 92, 246, 0.3));
            cursor: col-resize;
            transition: all 0.3s ease;
            position: relative;
        }

        .resize-handle:hover {
            background: linear-gradient(180deg, rgba(99, 102, 241, 0.6), rgba(139, 92, 246, 0.6));
            width: 8px;
        }

        /* Enhanced Prompt Footer */
        .prompt-footer {
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(99, 102, 241, 0.2);
            padding: 20px;
            flex-shrink: 0;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
        }

        .prompt-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .prompt-input-wrapper {
            display: flex;
            gap: 16px;
            align-items: flex-end;
            position: relative;
        }

        .prompt-input {
            flex: 1;
            background: rgba(30, 30, 60, 0.8);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 16px;
            padding: 16px 20px;
            color: #e2e8f0;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            min-height: 52px;
            max-height: 140px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .prompt-input:focus {
            outline: none;
            border-color: rgba(99, 102, 241, 0.6);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1), 0 8px 30px rgba(99, 102, 241, 0.2);
            background: rgba(30, 30, 60, 0.9);
        }

        .prompt-input::placeholder {
            color: #94a3b8;
        }

        .prompt-submit {
            height: 52px;
            width: 52px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            font-size: 18px;
        }

        .prompt-status {
            margin-top: 12px;
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
        }

        /* Enhanced Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 1000;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            color: #e2e8f0;
            font-size: 16px;
            font-weight: 500;
        }

        /* Streaming Response Styles */
        .streaming-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            color: #6366f1;
            font-size: 12px;
        }

        .streaming-indicator.active {
            display: flex;
        }

        .streaming-dots {
            display: flex;
            gap: 2px;
        }

        .streaming-dot {
            width: 4px;
            height: 4px;
            background: #6366f1;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .streaming-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .streaming-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }

        /* New Tab Preview Button */
        .preview-new-tab {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 10;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                padding: 8px 12px;
                flex-wrap: wrap;
                height: auto;
                min-height: 60px;
            }

            .header-right {
                flex-wrap: wrap;
                gap: 4px;
            }

            .btn {
                padding: 6px 12px;
                font-size: 13px;
            }

            .sidebar {
                width: 200px;
            }

            .editor-container {
                flex-direction: column;
            }

            .resize-handle {
                height: 4px;
                width: 100%;
                cursor: row-resize;
            }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0d1117;
        }

        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <span class="logo-icon">⭐</span>
                <span class="logo-text">Interstellar Lite</span>
                <span class="version-badge">v2.0</span>
            </div>
        </div>
        
        <div class="header-center">
            <!-- Navigation buttons will be added -->
        </div>
        
        <div class="header-right">
            <button class="btn btn-secondary" id="chatBtn">
                <span class="icon">💬</span>
                Chat
            </button>
            <button class="btn btn-secondary" id="previewBtn">
                <span class="icon">👁️</span>
                Preview
            </button>
            <button class="btn btn-secondary" id="loadBtn">
                <span class="icon">📁</span>
                Load existing Project
            </button>
            <button class="btn btn-secondary" id="cloneBtn">
                <span class="icon">🌐</span>
                Clone Website
            </button>
            <button class="btn btn-accent" id="publishBtn">
                <span class="icon">🚀</span>
                Publish to GitHub
            </button>
            <button class="btn btn-primary" id="saveBtn">
                <span class="icon">💾</span>
                Save your Project
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Sidebar -->
        <aside class="sidebar">
            <button class="btn btn-accent" id="newProjectBtn">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                </svg>
                New Project
            </button>

            <div class="sidebar-section">
                <h3>Project Actions</h3>
                <button class="btn btn-secondary" id="loadBtn">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                    </svg>
                    Load Project
                </button>
                <button class="btn btn-secondary" id="importBtn">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"></path>
                    </svg>
                    Import from GitHub
                </button>
                <button class="btn btn-secondary" id="cloneBtn">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9 3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path>
                    </svg>
                    Clone Website
                </button>
                <button class="btn btn-accent" id="publishBtn">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    Publish to GitHub
                </button>
                <button class="btn btn-primary" id="saveBtn">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
                    </svg>
                    Save Project
                </button>
            </div>

            <div class="sidebar-section">
                <h3>Settings</h3>
                <button class="btn btn-ghost" id="settingsBtn">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    Settings
                </button>
            </div>
        </aside>

        <!-- Editor and Preview Container -->
        <div class="editor-container">
            <!-- Code Editor -->
            <div class="editor-panel">
                <div class="panel-header">
                    <span class="panel-title">Code Editor</span>
                    <div class="panel-controls">
                        <button class="btn-icon" id="formatBtn" title="Format Code">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zM21 5a2 2 0 00-2-2h-4a2 2 0 00-2 2v12a4 4 0 004 4h4a2 2 0 002-2V5z"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="monaco-editor" class="monaco-editor"></div>
            </div>

            <!-- Resize Handle -->
            <div class="resize-handle" id="resizeHandle"></div>

            <!-- Preview Panel -->
            <div class="preview-panel">
                <div class="panel-header">
                    <span class="panel-title">Live Preview</span>
                    <div class="panel-controls">
                        <button class="btn-icon" id="refreshBtn" title="Refresh Preview">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                        </button>
                        <button class="btn-icon" id="newTabBtn" title="Open in New Tab">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                            </svg>
                        </button>
                        <button class="btn-icon" id="fullscreenBtn" title="Fullscreen Preview">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <iframe id="preview-iframe" class="preview-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-pointer-lock allow-top-navigation-by-user-activation"></iframe>
            </div>
        </div>
    </main>

    <!-- AI Prompt Input -->
    <footer class="prompt-footer">
        <div class="prompt-container">
            <div class="prompt-input-wrapper">
                <textarea 
                    id="promptInput" 
                    class="prompt-input" 
                    placeholder="Ask Interstellar Lite anything..."
                    rows="1"
                ></textarea>
                <button class="btn btn-primary prompt-submit" id="submitBtn">

        // Enhanced HTML extraction for streaming responses
        function extractCleanHTML(content) {
            // Remove any markdown code block formatting
            let cleanContent = content;

            // Try to extract from ```html blocks first
            const htmlBlockMatch = cleanContent.match(/```html\s*([\s\S]*?)\s*```/);
            if (htmlBlockMatch) {
                cleanContent = htmlBlockMatch[1].trim();
            } else {
                // Try to extract from generic ``` blocks
                const codeBlockMatch = cleanContent.match(/```\s*([\s\S]*?)\s*```/);
                if (codeBlockMatch) {
                    cleanContent = codeBlockMatch[1].trim();
                }
            }

            // If no code blocks found, check if content starts with HTML
            if (!htmlBlockMatch && !cleanContent.includes('```')) {
                // Remove any leading/trailing text that's not HTML
                const htmlStart = cleanContent.indexOf('<!DOCTYPE') !== -1 ?
                    cleanContent.indexOf('<!DOCTYPE') :
                    cleanContent.indexOf('<html');

                if (htmlStart !== -1) {
                    cleanContent = cleanContent.substring(htmlStart);
                }
            }

            // Validate that we have proper HTML
            if (cleanContent.includes('<!DOCTYPE') || cleanContent.includes('<html')) {
                return cleanContent.trim();
            }

            return null;
        }

            const container = document.querySelector('.editor-container');

            let isResizing = false;

            resizeHandle.addEventListener('mousedown', (e) => {
                isResizing = true;
                document.addEventListener('mousemove', handleResize);
                document.addEventListener('mouseup', stopResize);
                e.preventDefault();
            });

            function handleResize(e) {
                if (!isResizing) return;

                const containerRect = container.getBoundingClientRect();
                const newLeftWidth = e.clientX - containerRect.left;
                const containerWidth = containerRect.width;
                const handleWidth = 4;

                const leftPercentage = Math.max(20, Math.min(80, (newLeftWidth / containerWidth) * 100));
                const rightPercentage = 100 - leftPercentage;

                editorPanel.style.flex = `0 0 ${leftPercentage}%`;
                previewPanel.style.flex = `0 0 ${rightPercentage - (handleWidth / containerWidth * 100)}%`;
            }

            function stopResize() {
                isResizing = false;
                document.removeEventListener('mousemove', handleResize);
                document.removeEventListener('mouseup', stopResize);
            }
        }

                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;

                            try {
                                const parsed = JSON.parse(data);
                                const content = parsed.choices?.[0]?.delta?.content || '';
                                if (content) {
                                    fullContent += content;
                                    onChunk(content, fullContent);
                                }
                            } catch (e) {
                                // Skip invalid JSON
                            }
                        }
                    }
                }
            } finally {
                reader.releaseLock();
            }

            return fullContent;
        }

        function applyCodeEdits(currentCode, edits) {
            const lines = currentCode.split('\n');

            // Sort edits by line number in descending order to avoid index shifting
            edits.sort((a, b) => b.start_line - a.start_line);

            for (const edit of edits) {
                const startIdx = edit.start_line - 1; // Convert to 0-based
                const endIdx = edit.end_line ? edit.end_line - 1 : startIdx;

                switch (edit.operation) {
                    case 'replace':
                        const newLines = edit.new_content ? edit.new_content.split('\n') : [];
                        lines.splice(startIdx, endIdx - startIdx + 1, ...newLines);
                        break;
                    case 'insert':
                        const insertLines = edit.new_content ? edit.new_content.split('\n') : [];
                        lines.splice(startIdx, 0, ...insertLines);
                        break;
                    case 'delete':
                        lines.splice(startIdx, endIdx - startIdx + 1);
                        break;
                }
            }

            return lines.join('\n');
        }

                }, 1000);

            } catch (error) {
                console.error('Publishing error:', error);
                updatePromptStatus(`Publishing failed: ${error.message}`);
                setTimeout(() => updatePromptStatus(''), 5000);
            } finally {
                isProcessing = false;
            }
        }

        // GitHub Repository Import
        async function importFromGitHub() {
            const repoUrl = prompt('Enter GitHub repository URL:\n\nExample: https://github.com/username/repository\n\nNote: Will import index.html file only');

            if (!repoUrl || !repoUrl.trim()) {
                return;
            }

            const cleanUrl = repoUrl.trim();

            // Parse GitHub URL
            const githubMatch = cleanUrl.match(/github\.com\/([^\/]+)\/([^\/]+)/);
            if (!githubMatch) {
                updatePromptStatus('Invalid GitHub URL format');
                setTimeout(() => updatePromptStatus(''), 3000);
                return;
            }

            const [, owner, repo] = githubMatch;
            const repoName = repo.replace('.git', '');

            isProcessing = true;
            updatePromptStatus('Importing from GitHub...');

            try {
                // Fetch index.html from the repository
                const fileUrl = `https://api.github.com/repos/${owner}/${repoName}/contents/index.html`;
                const response = await fetch(fileUrl, {
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        ...(GITHUB_CONFIG.token && { 'Authorization': `token ${GITHUB_CONFIG.token}` })
                    }
                });

                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error('index.html file not found in repository');
                    }
                    throw new Error(`Failed to fetch file: ${response.statusText}`);
                }

                const fileData = await response.json();

                if (fileData.type !== 'file') {
                    throw new Error('index.html is not a file');
                }

                // Decode base64 content
                const htmlContent = atob(fileData.content);

                // Update project
                currentProject = {
                    name: `${repoName} (Imported)`,
                    code: htmlContent,
                    isInitialGeneration: false,
                    hasBeenGenerated: true,
                    importedFrom: `${owner}/${repoName}`,
                    importedAt: new Date().toISOString()
                };

                // Update editor
                if (editor) {
                    editor.setValue(htmlContent);
                }

                updatePromptStatus(`Successfully imported ${htmlContent.length} characters from ${owner}/${repoName}`);
                setTimeout(() => updatePromptStatus(''), 3000);

            } catch (error) {
                console.error('GitHub import error:', error);
                updatePromptStatus(`Import failed: ${error.message}`);
                setTimeout(() => updatePromptStatus(''), 5000);
            } finally {
                isProcessing = false;
            }
        }

        // Update prompt status message
        function updatePromptStatus(message) {
            document.getElementById('promptStatus').textContent = message;
        }

        // Show API key configuration dialog
        function showApiKeyDialog() {
            const apiKey = prompt('Please enter your OpenRouter API key:\n\nYou can get one from https://openrouter.ai/keys');
            if (apiKey && apiKey.trim()) {
                API_CONFIG.apiKey = apiKey.trim();
                localStorage.setItem('openrouter_api_key', API_CONFIG.apiKey);
                updatePromptStatus('API key saved! You can now use AI features.');
                setTimeout(() => updatePromptStatus(''), 3000);
            }
        }

        // Load API key from localStorage
        function loadApiKey() {
            const savedKey = localStorage.getItem('openrouter_api_key');
            if (savedKey) {
                API_CONFIG.apiKey = savedKey;
            }
        }

        // Settings dialog
        function showSettings() {
            const currentKey = API_CONFIG.apiKey ? '***' + API_CONFIG.apiKey.slice(-4) : 'Not set';
            const newKey = prompt(`Settings\n\nCurrent API Key: ${currentKey}\n\nEnter new OpenRouter API key (leave empty to keep current):`);

            if (newKey && newKey.trim()) {
                API_CONFIG.apiKey = newKey.trim();
                localStorage.setItem('openrouter_api_key', API_CONFIG.apiKey);
                updatePromptStatus('API key updated successfully!');
                setTimeout(() => updatePromptStatus(''), 3000);
            }
        }

        // Keyboard shortcuts
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                // Ctrl/Cmd + S: Save project
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    saveProject();
                }

                // Ctrl/Cmd + O: Load project
                if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
                    e.preventDefault();
                    loadProject();
                }

                // Ctrl/Cmd + N: New project
                if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                    e.preventDefault();
                    newProject();
                }

                // Ctrl/Cmd + Enter: Submit prompt
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    submitPrompt();
                }

                // F5: Refresh preview
                if (e.key === 'F5') {
                    e.preventDefault();
                    updatePreview();
                }

                // F11: Toggle fullscreen preview
                if (e.key === 'F11') {
                    e.preventDefault();
                    toggleFullscreenPreview();
                }

                // Escape: Exit fullscreen or close overlays
                if (e.key === 'Escape') {
                    // Close fullscreen if active
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    }
                    // Close fullscreen overlay if active
                    const overlay = document.getElementById('fullscreen-overlay');
                    if (overlay) {
                        closeFullscreenOverlay();
                    }
                }

                // Ctrl/Cmd + Shift + F: Format code
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'F') {
                    e.preventDefault();
                    formatCode();
                }

                // Ctrl/Cmd + Shift + P: Open preview in new tab
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'P') {
                    e.preventDefault();
                    openPreviewInNewTab();
                }
            });
        }

        // Initialize when DOM is loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
    </script>
</body>
</html>
