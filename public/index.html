    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Monaco Editor -->

    <style>
        /* CSS Variables for Theme System */
        :root {
            --bg-primary: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            --bg-secondary: rgba(30, 30, 60, 0.8);
            --bg-tertiary: rgba(15, 15, 35, 0.9);
            --bg-card: rgba(30, 30, 60, 0.6);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --accent-error: #ef4444;
            --border-color: rgba(99, 102, 241, 0.3);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --modal-bg: rgba(0, 0, 0, 0.8);
            --modal-content: rgba(30, 30, 60, 0.95);
        }

        [data-theme="light"] {
            --bg-primary: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #cbd5e1 100%);
            --bg-secondary: rgba(255, 255, 255, 0.9);
            --bg-tertiary: rgba(248, 250, 252, 0.95);
            --bg-card: rgba(255, 255, 255, 0.8);
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-success: #059669;
            --accent-warning: #d97706;
            --accent-error: #dc2626;
            --border-color: rgba(99, 102, 241, 0.2);
            --shadow-color: rgba(0, 0, 0, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.1);
            --modal-bg: rgba(0, 0, 0, 0.5);
            --modal-content: rgba(255, 255, 255, 0.98);
        }

        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        /* Header Styles */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--bg-secondary);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            position: relative;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 18px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .version-badge {
            background: var(--accent-success);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Button Styles */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--glass-bg);
            transform: translateY(-1px);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--accent-success), #059669);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            padding: 0;
            justify-content: center;
            border-radius: 8px;
        }

        /* Icon Styles */
        .icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .btn-icon .icon {
            width: 16px;
            height: 16px;
        }

        /* Main Layout */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .sidebar .btn {
            justify-content: flex-start;
            width: 100%;
            padding: 12px 16px;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Editor Container */
        .editor-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .editor-panel, .preview-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin: 10px;
            overflow: hidden;
            backdrop-filter: blur(20px);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
        }

        .panel-title {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .panel-controls {
            display: flex;
            gap: 8px;
        }

        #editor {
            flex: 1;
            background: var(--bg-tertiary);
        }

        #preview {
            flex: 1;
            border: none;
            background: white;
        }

        /* Prompt Area */
        .prompt-area {
            padding: 20px;
            background: var(--bg-secondary);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
        }

        .prompt-container {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            max-width: 1200px;
            margin: 0 auto;
        }

        .prompt-input {
            flex: 1;
            min-height: 44px;
            max-height: 120px;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            resize: none;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .prompt-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .prompt-input::placeholder {
            color: var(--text-muted);
        }

        .prompt-submit {
            width: 44px;
            height: 44px;
            padding: 0;
            justify-content: center;
            border-radius: 12px;
        }

        .prompt-status {
            text-align: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--text-secondary);
            min-height: 20px;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--modal-bg);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--modal-content);
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            transform: scale(0.9) translateY(20px);
            transition: all 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: var(--glass-bg);
            color: var(--text-primary);
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 8px 16px;
            }
            
            .logo {
                font-size: 16px;
            }
            
            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                height: 100vh;
                z-index: 200;
                transition: left 0.3s ease;
            }
            
            .sidebar.open {
                left: 0;
            }
            
            .main-container {
                flex-direction: column;
            }
            
            .editor-container {
                flex-direction: column;
            }
            
            .editor-panel, .preview-panel {
                margin: 5px;
            }
            
            .prompt-container {
                flex-direction: column;
                gap: 8px;
            }
            
            .prompt-submit {
                width: 100%;
                height: 44px;
            }
            
            .modal-content {
                margin: 20px;
                width: calc(100% - 40px);
            }
        }

        @media (max-width: 480px) {
            .header-actions {
                gap: 8px;
            }
            
            .btn {
                padding: 6px 12px;
                font-size: 13px;
            }
            
            .btn-icon {
                width: 32px;
                height: 32px;
            }
        }

        /* Loading and Animation States */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Theme Toggle */
        .theme-toggle {
            position: relative;
            width: 50px;
            height: 24px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-toggle::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            background: var(--accent-primary);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        [data-theme="light"] .theme-toggle::before {
            transform: translateX(24px);
        }

        /* Scrollbar Styles */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }
    </style>
</head>

            code: `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Interstellar Lite Pro</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: fadeInUp 1s ease;
        }
        p {
            font-size: 1.2rem;
            opacity: 0.9;
            animation: fadeInUp 1s ease 0.2s both;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <h1>🚀 Ready to Build Amazing Websites!</h1>
    <p>Ask me to create anything and I'll generate beautiful, modern websites for you.</p>
</body>
</html>`,
            isInitialGeneration: true,
            hasBeenGenerated: false
        };
        let isProcessing = false;

        // Initialize application
        document.addEventListener('DOMContentLoaded', initializeApp);

        function initializeApp() {
            setupMonacoEditor();
            setupEventListeners();
            setupMobileResponsive();
            loadSavedTheme();
            loadSavedProject();
            updatePreview();
        }

        // Monaco Editor Setup
        function setupMonacoEditor() {
            require.config({ paths: { vs: 'https://unpkg.com/monaco-editor@0.44.0/min/vs' } });
            require(['vs/editor/editor.main'], function () {
                editor = monaco.editor.create(document.getElementById('editor'), {
                    value: currentProject.code,
                    language: 'html',
                    theme: document.body.dataset.theme === 'dark' ? 'vs-dark' : 'vs',
                    automaticLayout: true,
                    fontSize: 14,
                    lineNumbers: 'on',
                    minimap: { enabled: false },
                    scrollBeyondLastLine: false,
                    wordWrap: 'on',
                    tabSize: 2,
                    insertSpaces: true,
                    formatOnPaste: true,
                    formatOnType: true
                });

                // Auto-save functionality
                let saveTimeout;
                editor.onDidChangeModelContent(() => {
                    clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(() => {
                        currentProject.code = editor.getValue();
                        autoSaveProject();
                        updatePreview();
                    }, 2000);
                });
            });
        }

        // Event Listeners
        function setupEventListeners() {
            // Theme toggle
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);

            // Main actions
            document.getElementById('newProjectBtn').addEventListener('click', newProject);
            document.getElementById('loadBtn').addEventListener('click', loadProject);
            document.getElementById('importBtn').addEventListener('click', () => showModal('import'));
            document.getElementById('cloneBtn').addEventListener('click', () => showModal('clone'));
            document.getElementById('publishBtn').addEventListener('click', () => showModal('publish'));
            document.getElementById('saveBtn').addEventListener('click', saveProject);
            document.getElementById('settingsBtn').addEventListener('click', () => showModal('settings'));

            // Editor controls
            document.getElementById('formatBtn').addEventListener('click', formatCode);
            document.getElementById('refreshBtn').addEventListener('click', updatePreview);
            document.getElementById('newTabBtn').addEventListener('click', openInNewTab);
            document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);

            // Prompt submission
            document.getElementById('submitBtn').addEventListener('click', submitPrompt);
            document.getElementById('promptInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    submitPrompt();
                }
            });

            // Auto-resize textarea
            const promptInput = document.getElementById('promptInput');
            promptInput.addEventListener('input', () => {
                promptInput.style.height = 'auto';
                promptInput.style.height = Math.min(promptInput.scrollHeight, 120) + 'px';
            });

            // Mobile menu toggle
            document.getElementById('menuToggle').addEventListener('click', toggleMobileMenu);

            // Keyboard shortcuts
            document.addEventListener('keydown', handleKeyboardShortcuts);
        }

        // Mobile Responsive Setup
        function setupMobileResponsive() {
            const mediaQuery = window.matchMedia('(max-width: 768px)');

            function handleMobileChange(e) {
                const menuToggle = document.getElementById('menuToggle');
                if (e.matches) {
                    menuToggle.style.display = 'flex';
                } else {
                    menuToggle.style.display = 'none';
                    document.getElementById('sidebar').classList.remove('open');
                }
            }

            mediaQuery.addListener(handleMobileChange);
            handleMobileChange(mediaQuery);
        }

        // Theme Management
        function toggleTheme() {
            const currentTheme = document.body.dataset.theme;
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            document.body.dataset.theme = newTheme;
            localStorage.setItem('theme', newTheme);

            // Update Monaco editor theme
            if (editor) {
                monaco.editor.setTheme(newTheme === 'dark' ? 'vs-dark' : 'vs');
            }

            // Update theme toggle icon
            const themeIcon = document.querySelector('#themeToggle .icon');
            if (newTheme === 'dark') {
                themeIcon.innerHTML = \`<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>\`;
            } else {
                themeIcon.innerHTML = \`<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>\`;
            }
        }

        // Load saved theme
        function loadSavedTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.body.dataset.theme = savedTheme;
            if (savedTheme === 'light') {
                const themeIcon = document.querySelector('#themeToggle .icon');
                themeIcon.innerHTML = \`<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>\`;
            }
        }

        // Mobile Menu Toggle
        function toggleMobileMenu() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // Keyboard Shortcuts
        function handleKeyboardShortcuts(e) {
            // Ctrl/Cmd + S: Save project
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveProject();
            }

            // Ctrl/Cmd + Enter: Submit prompt
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                submitPrompt();
            }

            // Ctrl/Cmd + N: New project
            if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                e.preventDefault();
                newProject();
            }

            // F11: Toggle fullscreen
            if (e.key === 'F11') {
                e.preventDefault();
                toggleFullscreen();
            }

            // Escape: Close modals
            if (e.key === 'Escape') {
                closeModal();
            }
        }

        // Modal System
        function createModal(id, title, content, actions = []) {
            const existingModal = document.getElementById(id);
            if (existingModal) {
                existingModal.remove();
            }

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.id = id;
            modal.innerHTML = \`
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 class="modal-title">\${title}</h3>
                        <button class="modal-close" onclick="closeModal('\${id}')">
                            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="modal-body">
                        \${content}
                    </div>
                    <div class="modal-actions">
                        \${actions.map(action => \`<button class="btn \${action.class}" onclick="\${action.onclick}">\${action.text}</button>\`).join('')}
                    </div>
                </div>
            \`;

            document.body.appendChild(modal);

            // Show modal with animation
            setTimeout(() => modal.classList.add('active'), 10);

            // Close on overlay click
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal(id);
                }
            });

            return modal;
        }

        function showModal(type) {
            switch (type) {
                case 'settings':
                    showSettingsModal();
                    break;
                case 'import':
                    showImportModal();
                    break;
                case 'clone':
                    showCloneModal();
                    break;
                case 'publish':
                    showPublishModal();
                    break;
            }
        }

        function closeModal(id) {
            const modal = id ? document.getElementById(id) : document.querySelector('.modal-overlay.active');
            if (modal) {
                modal.classList.remove('active');
                setTimeout(() => modal.remove(), 300);
            }
        }

        // Settings Modal
        function showSettingsModal() {
            const githubConnected = CONFIG.GITHUB_TOKEN ? 'Connected' : 'Not Connected';
            const githubStatus = CONFIG.GITHUB_TOKEN ? 'success' : 'error';

            const content = \`
                <div class="form-group">
                    <label class="form-label">GitHub Integration</label>
                    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
                        <span style="color: var(--accent-\${githubStatus}); font-weight: 500;">\${githubConnected}</span>
                        \${CONFIG.GITHUB_TOKEN ? \`<button class="btn btn-secondary" onclick="disconnectGitHub()">Disconnect</button>\` : ''}
                    </div>
                    \${!CONFIG.GITHUB_TOKEN ? \`
                        <input type="password" class="form-input" id="githubToken" placeholder="Enter GitHub Personal Access Token">
                        <small style="color: var(--text-muted); font-size: 12px; margin-top: 4px; display: block;">
                            Create a token at: <a href="https://github.com/settings/tokens" target="_blank" style="color: var(--accent-primary);">github.com/settings/tokens</a><br>
                            Required permissions: repo, pages
                        </small>
                    \` : ''}
                </div>

                <div class="form-group">
                    <label class="form-label">Theme</label>
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span>Dark</span>
                        <div class="theme-toggle" onclick="toggleTheme()"></div>
                        <span>Light</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Auto-Save</label>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="autoSave" checked>
                        <label for="autoSave">Automatically save changes every 2 seconds</label>
                    </div>
                </div>
            \`;

            const actions = [
                { text: 'Cancel', class: 'btn-secondary', onclick: 'closeModal("settingsModal")' },
                { text: 'Save Settings', class: 'btn-primary', onclick: 'saveSettings()' }
            ];

            createModal('settingsModal', 'Settings', content, actions);
        }

        function saveSettings() {
            const githubToken = document.getElementById('githubToken')?.value;
            if (githubToken && githubToken.trim()) {
                CONFIG.GITHUB_TOKEN = githubToken.trim();
                localStorage.setItem('github_token', CONFIG.GITHUB_TOKEN);
                updatePromptStatus('GitHub token saved successfully!');
            }
            closeModal('settingsModal');
        }

        function disconnectGitHub() {
            CONFIG.GITHUB_TOKEN = '';
            localStorage.removeItem('github_token');
            updatePromptStatus('GitHub disconnected');
            closeModal('settingsModal');
        }

        // Import Modal
        function showImportModal() {
            const content = \`
                <div class="form-group">
                    <label class="form-label">GitHub Repository URL</label>
                    <input type="url" class="form-input" id="importUrl" placeholder="https://github.com/username/repository">
                    <small style="color: var(--text-muted); font-size: 12px; margin-top: 4px; display: block;">
                        Will import the index.html file from the repository
                    </small>
                </div>
            \`;

            const actions = [
                { text: 'Cancel', class: 'btn-secondary', onclick: 'closeModal("importModal")' },
                { text: 'Import', class: 'btn-primary', onclick: 'executeImport()' }
            ];

            createModal('importModal', 'Import from GitHub', content, actions);
        }

        // Clone Modal
        function showCloneModal() {
            const content = \`
                <div class="form-group">
                    <label class="form-label">Website URL</label>
                    <input type="url" class="form-input" id="cloneUrl" placeholder="https://example.com">
                    <small style="color: var(--text-muted); font-size: 12px; margin-top: 4px; display: block;">
                        Enter any website URL to clone and enhance it with modern design
                    </small>
                </div>
            \`;

            const actions = [
                { text: 'Cancel', class: 'btn-secondary', onclick: 'closeModal("cloneModal")' },
                { text: 'Clone Website', class: 'btn-primary', onclick: 'executeClone()' }
            ];

            createModal('cloneModal', 'Clone Website', content, actions);
        }

        // Publish Modal
        function showPublishModal() {
            if (!CONFIG.GITHUB_TOKEN) {
                updatePromptStatus('Please connect your GitHub account in Settings first');
                showModal('settings');
                return;
            }

            const content = \`
                <div class="form-group">
                    <label class="form-label">Repository Name</label>
                    <input type="text" class="form-input" id="repoName" placeholder="my-awesome-website" value="\${currentProject.name.toLowerCase().replace(/[^a-z0-9]/g, '-')}">
                    <small style="color: var(--text-muted); font-size: 12px; margin-top: 4px; display: block;">
                        Repository will be created automatically if it doesn't exist
                    </small>
                </div>

                <div class="form-group">
                    <label class="form-label">Description (Optional)</label>
                    <input type="text" class="form-input" id="repoDescription" placeholder="My awesome website created with Interstellar Lite Pro">
                </div>
            \`;

            const actions = [
                { text: 'Cancel', class: 'btn-secondary', onclick: 'closeModal("publishModal")' },
                { text: 'Publish to GitHub Pages', class: 'btn-success', onclick: 'executePublish()' }
            ];

            createModal('publishModal', 'Publish to GitHub Pages', content, actions);
        }

        // Project Management
        function newProject() {
            if (currentProject.code !== getDefaultCode() && !confirm('Create a new project? Any unsaved changes will be lost.')) {
                return;
            }

            currentProject = {
                name: 'My App',
                code: getDefaultCode(),
                isInitialGeneration: true,
                hasBeenGenerated: false,
                createdAt: new Date().toISOString()
            };

            if (editor) {
                editor.setValue(currentProject.code);
            }
            updatePreview();
            updatePromptStatus('New project created!');
            setTimeout(() => updatePromptStatus(''), 3000);
        }

        function getDefaultCode() {
            return \`<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Interstellar Lite Pro</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: fadeInUp 1s ease;
        }
        p {
            font-size: 1.2rem;
            opacity: 0.9;
            animation: fadeInUp 1s ease 0.2s both;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <h1>🚀 Ready to Build Amazing Websites!</h1>
    <p>Ask me to create anything and I'll generate beautiful, modern websites for you.</p>
</body>
</html>\`;
        }

        function saveProject() {
            const projectData = {
                ...currentProject,
                code: editor ? editor.getValue() : currentProject.code,
                savedAt: new Date().toISOString()
            };

            const blob = new Blob([JSON.stringify(projectData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = \`\${currentProject.name.replace(/[^a-z0-9]/gi, '-')}.json\`;
            a.click();
            URL.revokeObjectURL(url);

            updatePromptStatus('Project saved successfully!');
            setTimeout(() => updatePromptStatus(''), 3000);
        }

        function loadProject() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const projectData = JSON.parse(e.target.result);
                            currentProject = projectData;
                            if (editor) {
                                editor.setValue(currentProject.code);
                            }
                            updatePreview();
                            updatePromptStatus(\`Project "\${currentProject.name}" loaded successfully!\`);
                            setTimeout(() => updatePromptStatus(''), 3000);
                        } catch (error) {
                            updatePromptStatus('Error loading project file');
                            setTimeout(() => updatePromptStatus(''), 3000);
                        }
                    };
                    reader.readAsText(file);
                }
            };
            input.click();
        }

        function autoSaveProject() {
            const projectData = {
                ...currentProject,
                code: editor ? editor.getValue() : currentProject.code,
                autoSavedAt: new Date().toISOString()
            };
            localStorage.setItem('currentProject', JSON.stringify(projectData));
        }

        function loadSavedProject() {
            const saved = localStorage.getItem('currentProject');
            if (saved) {
                try {
                    currentProject = JSON.parse(saved);
                } catch (error) {
                    console.warn('Failed to load saved project');
                }
            }
        }

        // Editor Functions
        function formatCode() {
            if (editor) {
                editor.getAction('editor.action.formatDocument').run();
                updatePromptStatus('Code formatted!');
                setTimeout(() => updatePromptStatus(''), 2000);
            }
        }

        function updatePreview() {
            const preview = document.getElementById('preview');
            const code = editor ? editor.getValue() : currentProject.code;

            const blob = new Blob([code], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            preview.src = url;

            // Clean up previous URL
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function openInNewTab() {
            const code = editor ? editor.getValue() : currentProject.code;
            const newWindow = window.open();
            newWindow.document.write(code);
            newWindow.document.close();
        }

        function toggleFullscreen() {
            const preview = document.getElementById('preview');
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                preview.requestFullscreen();
            }
        }

        // Status Updates
        function updatePromptStatus(message) {
            document.getElementById('promptStatus').textContent = message;
        }

        // Placeholder functions for AI integration and execution
        async function submitPrompt() {
            updatePromptStatus('AI integration coming soon...');
            setTimeout(() => updatePromptStatus(''), 3000);
        }

        async function executeImport() {
            updatePromptStatus('Import functionality coming soon...');
            setTimeout(() => updatePromptStatus(''), 3000);
            closeModal('importModal');
        }

        async function executeClone() {
            updatePromptStatus('Clone functionality coming soon...');
            setTimeout(() => updatePromptStatus(''), 3000);
            closeModal('cloneModal');
        }

        async function executePublish() {
            updatePromptStatus('Publish functionality coming soon...');
            setTimeout(() => updatePromptStatus(''), 3000);
            closeModal('publishModal');
        }
    </script>
</body>
</html>
